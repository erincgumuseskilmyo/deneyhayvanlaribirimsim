<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratuvar Hayvanları Yetiştirme Birimi — Eğitici Simülasyon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%AD%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Üst bilgi çubuğu -->
      <header id="hud" class="panel">
        <div class="stat-row" id="stat-row"></div>
        <div class="time-row">
          <span id="date-label">Gün 1</span>
          <div class="speed-buttons" id="speed-buttons"></div>
        </div>
      </header>

      <!-- Sol: inşa menüsü -->
      <aside id="build-panel" class="panel side-panel">
        <h2>İnşaat</h2>
        <div id="build-list"></div>
        <div id="build-hint" class="hint">Bir oda seç, sonra zemine tıkla.</div>
      </aside>

      <!-- Sağ: seçim / detay -->
      <aside id="detail-panel" class="panel side-panel right">
        <h2 id="detail-title">Tesis</h2>
        <div id="detail-body"></div>
      </aside>

      <!-- Alt: sekmeler -->
      <nav id="tabbar" class="panel"></nav>

      <!-- Bildirimler -->
      <div id="toasts"></div>

      <!-- Modal katmanı -->
      <div id="modal-layer" class="hidden">
        <div id="modal" class="panel"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
